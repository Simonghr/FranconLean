name: Sync Roller Revenue

on:
  schedule:
    # Every hour between 11h and 21h (Europe/Paris) — covers opening hours
    # and saves compute outside them. UTC window is widened to 9-20 to cover
    # both CET/CEST; the job itself skips the run if outside local 11-21.
    - cron: "0 9-20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to re-sync (default: 7 — covers Roller's settling window)"
        required: false
        default: "7"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Skip outside 11h-21h Paris time (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
          echo "Current Paris hour: $PARIS_HOUR"
          if [ "$PARIS_HOUR" -lt 11 ] || [ "$PARIS_HOUR" -gt 21 ]; then
            echo "Outside 11h-21h Paris window, skipping sync."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Call rapid-processor Edge Function (chunked by 10 days)
        if: env.SKIP != 'true'
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          BASE="${{ secrets.SUPABASE_URL }}"
          BASE="${BASE%/}"  # strip any trailing slash
          CHUNK=10          # max days per call (Supabase compute limit)

          # Build the inclusive date window [start .. end] ending today.
          END=$(date -u +%F)
          START=$(date -u -d "$END - $((DAYS - 1)) days" +%F)

          echo "Backfill window: $START -> $END (chunks of $CHUNK days)"

          GRAND_TOTAL=0
          FAILED=0
          cur="$START"

          while [ "$cur" \< "$END" ] || [ "$cur" = "$END" ]; do
            chunk_end=$(date -u -d "$cur + $((CHUNK - 1)) days" +%F)
            if [ "$chunk_end" \> "$END" ]; then chunk_end="$END"; fi

            echo "---- Chunk $cur -> $chunk_end ----"
            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "$BASE/functions/v1/rapid-processor" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"startDate\": \"$cur\", \"endDate\": \"$chunk_end\"}" \
              --max-time 300)

            echo "HTTP status: $HTTP_CODE"
            cat response.json | jq . 2>/dev/null || cat response.json

            if [ "$HTTP_CODE" != "200" ] || ! jq -e '.success == true' response.json > /dev/null 2>&1; then
              echo "::error::chunk $cur -> $chunk_end failed (HTTP $HTTP_CODE)"
              FAILED=1
            else
              CA=$(jq -r '.totalCA // 0' response.json)
              GRAND_TOTAL=$(echo "$GRAND_TOTAL + $CA" | bc -l)
            fi

            cur=$(date -u -d "$chunk_end + 1 day" +%F)
          done

          echo "=================================="
          printf "TOTAL CA synced: %.2f EUR\n" "$GRAND_TOTAL"
          [ "$FAILED" = "0" ] || { echo "::error::one or more chunks failed"; exit 1; }
          echo "Sync OK"

      - name: Reapply Budget Prévisionnel targets (rapid-processor overwrites them with a flat fallback)
        if: env.SKIP != 'true'
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          BASE="${{ secrets.SUPABASE_URL }}"
          BASE="${BASE%/}"
          SITE_ID="00000000-0000-0000-0000-000000000001"
          ANON="${{ secrets.SUPABASE_ANON_KEY }}"

          END=$(date -u +%F)
          START=$(date -u -d "$END - $((DAYS - 1)) days" +%F)
          cur="$START"

          while [ "$cur" \< "$END" ] || [ "$cur" = "$END" ]; do
            TARGET=$(curl -s \
              "$BASE/rest/v1/budgets?site_id=eq.$SITE_ID&date=eq.$cur&select=target" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              | jq -r '.[0].target // empty')

            if [ -n "$TARGET" ]; then
              curl -s -o /dev/null -w "  $cur -> target $TARGET (HTTP %{http_code})\n" -X PATCH \
                "$BASE/rest/v1/sales?site_id=eq.$SITE_ID&date=eq.$cur&period=eq.day" \
                -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
                -H "Content-Type: application/json" -H "Prefer: return=minimal" \
                -d "{\"target\": $TARGET}"
            else
              echo "  $cur -> no budget row, skipping"
            fi

            cur=$(date -u -d "$cur + 1 day" +%F)
          done
