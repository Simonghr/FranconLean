name: Sync Roller Bookings (Anniversaires)

on:
  schedule:
    # Twice a day — keeps the upcoming weekend's anniversary booking counts fresh.
    - cron: "0 6,16 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days ahead to sync (default: 14)"
        required: false
        default: "14"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-bookings Edge Function
        run: |
          DAYS="${{ github.event.inputs.days || '14' }}"
          BASE="${{ secrets.SUPABASE_URL }}"
          BASE="${BASE%/}"  # strip any trailing slash

          echo "Syncing next $DAYS days of bookings"
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$BASE/functions/v1/sync-bookings" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"days\": $DAYS}" \
            --max-time 300)

          echo "HTTP status: $HTTP_CODE"
          cat response.json | jq . 2>/dev/null || cat response.json

          if [ "$HTTP_CODE" != "200" ] || ! jq -e '.success == true' response.json > /dev/null 2>&1; then
            echo "::error::sync-bookings failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Sync OK"
